<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>CSS GRID</h1>

    <section class="grid-layout">
      <header class="box header">Header</header>
      <aside class="box sidebar">Side Bar</aside>
      <section class="box content-one">Content 1</section>
      <section class="box content-two">Content 2</section>
      <section class="box content-three">Content 3</section>
      <footer class="box footer">Footer</footer>
    </section>
  </main>
</body>
</html>
